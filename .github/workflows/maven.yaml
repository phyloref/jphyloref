# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Build with Maven

# Execute on every pull request and if activated manually.
on: [pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # Report every JDK's result rather than cancelling the rest on the first failure.
      fail-fast: false
      matrix:
        # Every Java LTS from the one this project targets (maven.compiler.release in
        # pom.xml) upwards. Add each new LTS as soon as Temurin releases it (Java 29 is
        # due in September 2027), so that breakage shows up while the older LTSes are
        # still supported; drop one when it falls below the target. Newer JDKs have
        # broken the build tooling before (JaCoCo could not instrument class files
        # newer than Java 15).
        java-version: ['21', '25']

    name: Build with JDK ${{ matrix.java-version }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java-version }}
        distribution: temurin
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    # The tests run against Maven's classpath, not the shaded JAR, so check that the JAR
    # users run still works (shading once silently dropped most parser registrations).
    - name: Smoke-test the shaded JAR
      run: |
        java -jar target/JPhyloRef.jar test src/test/resources/phylorefs/dummy1.owl
        java -jar target/JPhyloRef.jar resolve src/test/resources/phylorefs/dummy1.jsonld -j

  docker:
    runs-on: ubuntu-latest
    name: Build and smoke-test the Docker image

    steps:
    - uses: actions/checkout@v7
    - name: Build the Docker image
      run: docker build --pull -t jphyloref:ci .
    - name: Smoke-test it through webhook
      run: webhook/smoke-test.sh jphyloref:ci
